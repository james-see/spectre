# Spectre aggregator — RuView sensing server on OrbStack/Docker
#
#   docker compose up -d
#   open http://127.0.0.1:3000
#
# Nodes stream CSI UDP → host:5005 (already provisioned to TARGET_IP).

services:
  sensing-server:
    image: ruvnet/wifi-densepose:latest
    container_name: spectre-sensing
    ports:
      - "127.0.0.1:3000:3000"   # UI + REST
      - "127.0.0.1:3001:3001"   # WebSocket
      - "5005:5005/udp"        # ESP32 CSI (LAN)
    environment:
      RUST_LOG: info
      CSI_SOURCE: esp32
      # Bind all interfaces inside the container so Docker port publish works.
      # Host mapping keeps HTTP/WS on 127.0.0.1 only; UDP 5005 is LAN-facing on purpose.
      RUVIEW_BIND_ADDR: "0.0.0.0"
      RUVIEW_ALLOW_UNAUTHENTICATED: "1"
      MODELS_DIR: /app/models
    # Prepend sensing-server flags (entrypoint adds --source etc.)
    command:
      - --model
      - /app/models/wifi-densepose-pretrained.rvf
    volumes:
      # Live-by-default Observatory UI (overrides image demo defaults)
      - ./ui/observatory.html:/app/ui/observatory.html:ro
      - ./ui/observatory/js/main.js:/app/ui/observatory/js/main.js:ro
      - ./ui/observatory/js/hud-controller.js:/app/ui/observatory/js/hud-controller.js:ro
      # Training panel: activity label + session name before Record
      - ./ui/components/TrainingPanel.js:/app/ui/components/TrainingPanel.js:ro
      # Model UI: tolerate images missing GET /api/v1/models/:id
      - ./ui/services/model.service.js:/app/ui/services/model.service.js:ro
      - ./ui/components/LiveDemoTab.js:/app/ui/components/LiveDemoTab.js:ro
      # Persist recordings/models across container recreate
      - ./data:/app/data
      # HF → .rvf pretrained (./scripts/fetch_models.sh)
      - ./models:/app/models:ro
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
